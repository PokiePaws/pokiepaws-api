spring.application.name=pokiepaws-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.first-name=${ADMIN_FIRST_NAME}
app.admin.last-name=${ADMIN_LAST_NAME}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
springdoc.use-management-port=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.disable-swagger-default-url=true

server.port=${SERVER_PORT}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:PokiePaws <no-reply@pokiepaws.local>}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}


app.base-url=${BASE_URL}
app.frontend-url=${FRONTEND_URL}
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
app.firebase.service-account-json-base64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
app.data-init.enabled=${DATA_INIT_ENABLED:false}
app.visit-reminders.enabled=${VISIT_REMINDERS_ENABLED:true}
app.visit-reminders.scan-delay-ms=${VISIT_REMINDERS_SCAN_DELAY_MS:60000}
app.visits.schedule.slot-minutes=${VISIT_SLOT_MINUTES:30}
app.visits.schedule.work-start=${VISIT_WORK_START:09:00}
app.visits.schedule.work-end=${VISIT_WORK_END:17:00}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
