name: Java Tests with Coverage

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Spotless (format check)
        run: ./mvnw -q spotless:check

      - name: Run tests + SpotBugs + Coverage
        run: ./mvnw verify
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Debug - List coverage files
        if: always()
        run: |
          echo "Listing target/site:"
          ls -la target/site || true
          echo "Finding jacoco outputs:"
          find target -maxdepth 4 -type f \( -name "jacoco.xml" -o -name "index.html" -o -name "*.exec" \) || true

      - name: Upload Coverage Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            target/site/jacoco/**
            target/surefire-reports/**
            target/failsafe-reports/**