services:
  postgres:
    image: postgres:16
    container_name: pokiepaws-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pokiepaws-net

  app:
    build: .
    container_name: pokiepaws-api
    ports:
      - "${APP_PORT}:${SERVER_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      MAIL_FROM: ${MAIL_FROM:-PokiePaws <no-reply@pokiepaws.local>}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-${FRONTEND_URL}}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}
      DATA_INIT_ENABLED: ${DATA_INIT_ENABLED:-true}
      VISIT_REMINDERS_ENABLED: ${VISIT_REMINDERS_ENABLED:-true}
      VISIT_REMINDERS_SCAN_DELAY_MS: ${VISIT_REMINDERS_SCAN_DELAY_MS:-60000}
      VACCINATION_REMINDERS_ENABLED: ${VACCINATION_REMINDERS_ENABLED:-true}
      VACCINATION_REMINDERS_SCAN_DELAY_MS: ${VACCINATION_REMINDERS_SCAN_DELAY_MS:-3600000}
      RABIES_VACCINATION_VALID_YEARS: ${RABIES_VACCINATION_VALID_YEARS:-1}
      RABIES_VACCINATION_REMIND_BEFORE_DAYS: ${RABIES_VACCINATION_REMIND_BEFORE_DAYS:-30}
      VISIT_SLOT_MINUTES: ${VISIT_SLOT_MINUTES:-30}
      VISIT_WORK_START: ${VISIT_WORK_START:-09:00}
      VISIT_WORK_END: ${VISIT_WORK_END:-17:00}
      DEFAULT_OWNER_PASSWORD: ${DEFAULT_OWNER_PASSWORD:-Owner1234!}
      DEFAULT_VET_PASSWORD: ${DEFAULT_VET_PASSWORD:-Vet1234!}
      DEFAULT_WORKER_PASSWORD: ${DEFAULT_WORKER_PASSWORD:-Worker1234!}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/${SERVER_PORT}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pokiepaws-net

  mailpit:
    image: axllent/mailpit
    container_name: pokiepaws-mail
    ports:
      - "${MAILPIT_DASHBOARD_PORT}:${MAILPIT_DASHBOARD_PORT}"
      - "${MAILPIT_SMTP_PORT}:${MAILPIT_SMTP_PORT}"
    restart: unless-stopped
    networks:
      - pokiepaws-net

networks:
  pokiepaws-net:
    driver: bridge

volumes:
  postgres_data:
